name: Market cache precompute

# Substitutes for "your own always-on infra" mentioned in
# packages/market-cache-builder/README.md - this project has no dedicated
# server, so the precompute cron runs here instead. Cadence is every 2 hours
# rather than the extension's 30-minute CACHE_TTL_MINUTES, which was set while
# this lived in a private repo where Actions minutes are metered. Public repos
# get unmetered minutes, so the cadence is now a choice about cache freshness
# and load on Polymarket's API rather than a billing constraint - tighten it if
# a 2-hour-stale cache stops being good enough.
on:
  schedule:
    - cron: '17 */2 * * *' # odd minute to avoid the GH-wide top-of-hour pile-up
  workflow_dispatch: {} # manual "run now" button in the Actions tab

jobs:
  build-cache:
    # This job writes the shared market cache, so exactly one repo may run it.
    # The private Sofiia7/actually-extension held that role while it held the
    # secrets; the cache is now built here, and that repo is archived. The gate
    # stays because a fork or a restored copy inherits the schedule along with
    # the file, and a second writer racing this one would be invisible until
    # the cache started flickering between two builds.
    if: github.repository == 'Sofiia7/actually'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # transformers.js's own default cache dir is NOT cwd-relative (it
      # resolves against the library's own location in node_modules), so
      # build.ts sets `env.cacheDir = './.cache'` explicitly to make it land
      # here, relative to this job's working-directory below. Without both
      # halves matching, every single run re-downloads the model from
      # huggingface.co (slow, and adds load to their CDN for nothing) even
      # on a cache hit for this key.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: packages/market-cache-builder/.cache
          key: minilm-l12-v2-${{ hashFiles('packages/core/src/constants.ts') }}

      - name: Precompute and push the market cache
        working-directory: packages/market-cache-builder
        env:
          WORKER_URL: ${{ secrets.ACTUALLY_WORKER_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.ACTUALLY_WORKER_SHARED_SECRET }}
          MARKET_CACHE_WRITE_SECRET: ${{ secrets.ACTUALLY_MARKET_CACHE_WRITE_SECRET }}
        run: npm run build-cache
