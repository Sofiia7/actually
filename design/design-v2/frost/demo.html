<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Frost module — demo</title>
<link rel="stylesheet" href="frost.css" />
<style>
  html,body{height:100%;margin:0;}
  body{
    display:grid; place-items:center;
    background:
      radial-gradient(120% 120% at 30% 20%, #2a3a5c, #0c1322 70%);
    font-family: system-ui, sans-serif;
  }
  .panel{
    position:relative;
    width:380px; height:240px; border-radius:20px;
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,.16);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    color:#eaf1ff; overflow:hidden;
  }
  .panel .body{ position:relative; padding:28px; }
  .panel h2{ margin:0 0 8px; font-size:20px; }
  .panel p{ margin:0; opacity:.7; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="panel frost-host">
    <span aria-hidden class="frost-needles"><span class="frost-fill"></span></span>
    <div class="body">
      <h2>Frosted panel</h2>
      <p>Move the cursor across this card — the needle-frost pattern melts
         into view under the pointer and stays denser toward the edges.</p>
    </div>
  </div>

  <script src="frost.js"></script>
  <script>
    document.querySelectorAll('.frost-host').forEach(function (el) {
      window.Frost.attachFrostTracking(el);
    });
  </script>
</body>
</html>
