<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actually — CWS small promo tile 440x280</title>
<style>
  /* ============================================================
     Chrome Web Store SMALL promo tile — 440x280 exact.
     Screenshot the body at 440x280, no device scaling needed
     (CWS accepts 440x280 PNG/JPEG).
     ============================================================ */
  /* Brand font: Marck Script, same three subsets the extension ships
     (extension/src/popup_new/fonts.css). Latin subset renders "Actually". */
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 440px; height: 280px;
    overflow: hidden;
    background: #0a0f1e;
  }
  body {
    position: relative;
    font-family: "Segoe UI", "SF Pro Text", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- background: deep fintech navy + brand-color glows ---- */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(560px 400px at 76% 18%, rgba(30, 95, 215, .22), transparent 62%),
      radial-gradient(480px 360px at 16% 92%, rgba(185, 35, 55, .18), transparent 62%),
      linear-gradient(158deg, #101830 0%, #0a0f1e 52%, #0b101f 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(130% 130% at 50% 42%, transparent 55%, rgba(3, 5, 11, .55) 100%);
  }

  /* ---- composition ---- */
  main {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding-bottom: 6px;
  }
  .lockup { display: flex; align-items: center; gap: 20px; }

  .orb { position: relative; width: 92px; height: 92px; flex: 0 0 auto; }
  .orb .glow {
    position: absolute; inset: -34%;
    background:
      radial-gradient(circle at 66% 28%, rgba(64, 125, 235, .50), transparent 58%),
      radial-gradient(circle at 30% 76%, rgba(205, 55, 85, .42), transparent 58%);
    filter: blur(14px);
  }
  .orb img {
    position: relative; width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .55));
  }

  .word {
    font-family: 'Marck Script', cursive;
    font-size: 76px; line-height: 1.1; font-weight: 400;
    color: #F2F6FA;
    text-shadow: 0 2px 26px rgba(110, 155, 255, .38), 0 1px 2px rgba(0, 0, 0, .45);
    /* script ascenders/descenders overshoot the em box — give them room */
    padding: 10px 8px 14px; margin: -10px -8px -14px;
    white-space: nowrap;
  }

  .tag {
    font-size: 13px; font-weight: 600;
    letter-spacing: .24em; text-transform: uppercase;
    color: rgba(206, 221, 243, .82);
    text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <main>
    <div class="lockup">
      <div class="orb">
        <div class="glow"></div>
        <img src="sphere.png" alt="">
      </div>
      <div class="word">Actually</div>
    </div>
    <div class="tag">See what markets really think</div>
  </main>
</body>
</html>
