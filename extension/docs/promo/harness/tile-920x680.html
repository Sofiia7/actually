<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Actually — CWS large promo tile 920x680</title>
<style>
  /* ============================================================
     Chrome Web Store LARGE promo tile — 920x680 exact.
     ============================================================ */
  /* Brand font: Marck Script, same three subsets the extension ships
     (extension/src/popup_new/fonts.css). Latin subset renders "Actually". */
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Marck Script'; font-weight: 400; font-style: normal;
    src: url('./MarckScript-Regular-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 920px; height: 680px;
    overflow: hidden;
    background: #0a0f1e;
  }
  body {
    position: relative;
    font-family: "Segoe UI", "SF Pro Text", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- background ---- */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1100px 760px at 74% 16%, rgba(30, 95, 215, .22), transparent 60%),
      radial-gradient(950px 700px at 16% 96%, rgba(185, 35, 55, .18), transparent 60%),
      linear-gradient(158deg, #101830 0%, #0a0f1e 52%, #0b101f 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(148, 170, 215, .06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 170, 215, .06) 1px, transparent 1px);
    background-size: 58px 58px;
    background-position: 50% 0;
    -webkit-mask-image: radial-gradient(75% 70% at 50% 40%, #000 25%, transparent 100%);
            mask-image: radial-gradient(75% 70% at 50% 40%, #000 25%, transparent 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(130% 130% at 50% 42%, transparent 55%, rgba(3, 5, 11, .55) 100%);
  }

  /* ---- composition ---- */
  main {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
    padding-top: 8px;
  }

  .orb { position: relative; width: 296px; height: 296px; flex: 0 0 auto; }
  .orb .glow {
    position: absolute; inset: -30%;
    background:
      radial-gradient(circle at 66% 28%, rgba(64, 125, 235, .48), transparent 58%),
      radial-gradient(circle at 30% 76%, rgba(205, 55, 85, .40), transparent 58%);
    filter: blur(30px);
  }
  .orb img {
    position: relative; width: 100%; height: 100%; display: block;
    filter: drop-shadow(0 26px 46px rgba(0, 0, 0, .55));
  }

  /* ---- floating market pills (UI hint) ---- */
  .pill {
    position: absolute;
    display: inline-flex; align-items: center; gap: 10px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .07));
    border: 1px solid rgba(255, 255, 255, .32);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    white-space: nowrap;
    font-weight: 700; letter-spacing: .02em; color: #F2F6FA;
  }
  .pill .dot {
    border-radius: 50%; flex: 0 0 auto;
    /* ProbDot recipe from the extension popup */
  }
  .pill.yes {
    right: -118px; top: 44%;
    padding: 13px 22px; font-size: 21px;
    transform: rotate(-3deg);
    box-shadow: 0 12px 30px rgba(0, 0, 0, .45), 0 0 26px rgba(220, 95, 100, .30),
                inset 0 1px 0 rgba(255, 255, 255, .28);
  }
  .pill.yes .dot {
    width: 15px; height: 15px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.92) 0%, rgba(227,143,148,.95) 60%, rgb(227,143,148) 100%);
    box-shadow: 0 0 10px rgba(227, 143, 148, .65), inset 0 0 0 1px rgba(255, 255, 255, .55);
  }
  .pill.yes .num { color: rgb(242, 168, 173); margin-left: 2px; }

  .pill.no {
    left: -100px; top: 12%;
    padding: 10px 18px; font-size: 17px;
    transform: rotate(2.5deg);
    opacity: .96;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .45), 0 0 22px rgba(100, 165, 230, .28),
                inset 0 1px 0 rgba(255, 255, 255, .28);
  }
  .pill.no .dot {
    width: 12px; height: 12px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.92) 0%, rgba(145,191,236,.95) 60%, rgb(145,191,236) 100%);
    box-shadow: 0 0 9px rgba(145, 191, 236, .65), inset 0 0 0 1px rgba(255, 255, 255, .55);
  }
  .pill.no .num { color: rgb(168, 205, 242); margin-left: 2px; }

  /* ---- wordmark + tagline ---- */
  .word {
    font-family: 'Marck Script', cursive;
    font-size: 138px; line-height: 1.1; font-weight: 400;
    color: #F2F6FA;
    text-shadow: 0 3px 40px rgba(110, 155, 255, .38), 0 2px 3px rgba(0, 0, 0, .45);
    white-space: nowrap;
    margin-top: 10px;
    /* script overshoot room */
    padding: 12px 10px 20px; margin-left: -10px; margin-right: -10px; margin-bottom: -20px;
  }
  .tag {
    font-size: 20px; font-weight: 600;
    letter-spacing: .26em; text-transform: uppercase;
    color: rgba(206, 221, 243, .82);
    text-shadow: 0 1px 10px rgba(0, 0, 0, .5);
    white-space: nowrap;
    margin-top: 22px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
  <main>
    <div class="orb">
      <div class="glow"></div>
      <img src="sphere.png" alt="">
      <div class="pill yes"><span class="dot"></span>YES <span class="num">67%</span></div>
      <div class="pill no"><span class="dot"></span>NO <span class="num">33%</span></div>
    </div>
    <div class="word">Actually</div>
    <div class="tag">See what markets really think</div>
  </main>
</body>
</html>
