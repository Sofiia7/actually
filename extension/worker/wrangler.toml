name = "actually-api"
main = "index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Set CLOUDFLARE_ACCOUNT_ID in env or `wrangler login`, or add account_id here
# locally (do not commit). See wrangler.toml.example for the expected shape.
workers_dev = true

# Atomic rate limiting + OpenAI daily cap (see worker/index.ts's RateLimiterDO).
# Requires the Workers PAID plan — Durable Objects aren't on Workers Free.
# Provisioned automatically by `wrangler deploy` via [[migrations]] below, no
# manual `wrangler kv namespace create`-style step needed.
[[durable_objects.bindings]]
name = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1-rate-limiter" # bump the tag if RateLimiterDO's class ever changes shape
new_sqlite_classes = ["RateLimiterDO"]

# Telemetry persistence (bound via dashboard 2026-07-13; keep this block in
# sync — a future `wrangler deploy` without it would silently DROP the
# dashboard-added binding).
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "actually_telemetry"

[[kv_namespaces]]
binding = "MARKET_CACHE"
# Create with: npx wrangler kv namespace create MARKET_CACHE
# The real id is committed deliberately: a KV namespace id is not a secret
# (useless without an account API token) — see SECURITY.md. Fork operators
# replace it with their own namespace's id.
id = "e1c0e2aa31b94900847aca14def4b261"

[vars]
# Non-secret defaults — override in CF dashboard or `wrangler secret put`.
#
# ALLOWED_EXTENSION_ID
#   Required for production. Set this to your Chrome extension ID (from
#   chrome://extensions or the Web Store listing). Worker fails 503 without it
#   unless WORKER_DEV_MODE=true. Comma-separated list supported.
ALLOWED_EXTENSION_ID = "lljnfdfoieiodiiaglimlfjlebljdmhb"
#
# WORKER_DEV_MODE
#   Set to "true" ONLY for local dev. Bypasses the requirement to have
#   WORKER_SHARED_SECRET and ALLOWED_EXTENSION_ID set. Never enable in prod.
WORKER_DEV_MODE = ""
#
# EXTRA_BLOCKED_COUNTRIES
#   Comma-separated ISO country codes to block in addition to the hardcoded
#   BLOCKED_COUNTRIES list in index.ts (commercial restrictions + OFAC-
#   sanctioned jurisdictions). Use this for fast additions without a code
#   change/redeploy. Empty by default.
EXTRA_BLOCKED_COUNTRIES = ""
#
# Secrets to set via `wrangler secret put`:
#   WORKER_SHARED_SECRET    — random 32+ chars (openssl rand -hex 32),
#                             also baked into the extension via
#                             VITE_WORKER_SECRET. Rotate together.
#   OPENAI_API_KEY          — only if you offer centralized OpenAI embeddings
#   MARKET_CACHE_WRITE_SECRET — separate secret gating PUT /market-cache,
#                             used by the cron precompute job (never baked
#                             into the extension or MCP server).
